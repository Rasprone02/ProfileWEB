<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Profil Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }

        .header-profil {
            background-color: #1d3f61; 
            color: white;
            text-align: center;
            padding: 80px 20px 100px 20px;
        }
        
        .header-profil h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
        }

        .kontainer {
            max-width: 500px;
            margin: -60px auto 20px auto; 
            text-align: center;
            padding: 0 20px;
        }

  
        .foto-profil {
            width: 150px;
            height: 150px;
            border-radius: 50%; 
            object-fit: cover;
            border: 5px solid white; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2; 
        }

     
        .kartu-info {
            background-color: white;
            border-radius: 15px; 
            padding: 60px 30px 30px 30px;
            margin-top: -75px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: left;
        }

        .kartu-info h2 {
            text-align: center;
            color: #333;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .kartu-info p {
            font-size: 1.1em;
            color: #555;
            margin: 15px 0;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee; 
        }

    
        .kartu-info p:last-child {
            border-bottom: none; 
        }

        .label {
            font-weight: bold;
            color: #2c3e50;
            display: inline-block;
            width: 100px;
        }
    </style>
</head>
<body>


    <div class="header-profil">
        <h1>PROFIL SAYA</h1>
    </div>

    <div class="kontainer">
        <img src="Foto.jpg" alt="Foto Profil Saya" class="foto-profil">

   
        <div class="kartu-info">
            <h2>Rashif Sabar Amrullah</h2>
            <p><span class="label">Alamat</span> : Jl. Sekepanjang 1  No. 59</p>
            <p><span class="label">Asal Kota</span> : Bandung</p>
            <p><span class="label">Email</span> : rashifsa007@gmail.com</p>
        </div>
    </div>

</body>
</html>
